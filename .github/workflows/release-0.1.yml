name: Publish S3 Client 0.1 for Linux

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-0.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-linux:
    if: github.repository == 'tmylt/S3Client'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: '0.1'
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Linux AppImage
        run: npm run dist

      - name: Checksum the AppImage
        working-directory: release
        run: sha256sum 'S3 Client-0.1.0.AppImage' > 'S3 Client-0.1.0.AppImage.sha256'

      - name: Publish the release and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 0.1 \
            'release/S3 Client-0.1.0.AppImage' \
            'release/S3 Client-0.1.0.AppImage.sha256' \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'S3 Client 0.1' \
            --notes 'First Linux x86-64 release. Download the AppImage, make it executable, and run it. See README.md for connection setup and current platform limitations.'
