name: Publish S3 Client 0.1 for Linux

on:
  push:
    branches:
      - main
    tags:
      - '0.1'
    paths:
      - .github/workflows/release-0.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-linux:
    if: github.repository == 'tmylt/S3Client'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: '0.1'
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Linux AppImage
        run: |
          if npm run dist -- --publish never > build.log 2>&1; then
            tail -n 30 build.log
          else
            {
              echo '### AppImage build failure'
              echo '```text'
              tail -n 100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 build.log
            exit 1
          fi

      - name: Prepare release assets
        run: |
          mv 'release/S3 Client-0.1.0.AppImage' 'release/S3.Client-0.1.0.AppImage'
          cd release
          sha256sum 'S3.Client-0.1.0.AppImage' > 'S3.Client-0.1.0.AppImage.sha256'

      - name: Publish the release and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload 0.1 \
              'release/S3.Client-0.1.0.AppImage' \
              'release/S3.Client-0.1.0.AppImage.sha256' \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create 0.1 \
              'release/S3.Client-0.1.0.AppImage' \
              'release/S3.Client-0.1.0.AppImage.sha256' \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title 'S3 Client 0.1' \
              --notes 'First Linux x86-64 release. Download the AppImage, make it executable, and run it. See README.md for connection setup and current platform limitations.'
          fi
